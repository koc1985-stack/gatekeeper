name: ImpulseGatekeeper
options:
  bundleIdPrefix: com.impulsegatekeeper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: tr
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ImpulseGatekeeper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "Bekle"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: ImpulseGatekeeper.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.impulsegatekeeper.app
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impulsegatekeeper.app
        PRODUCT_NAME: "Bekle"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  ImpulseGatekeeper:
    build:
      targets:
        ImpulseGatekeeper: all
    run:
      config: Debug
      storeKitConfiguration: Resources/Configuration.storekit
    test:
      config: Debug
    archive:
      config: Release
