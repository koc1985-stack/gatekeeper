name: ImpulseGatekeeper
options:
  bundleIdPrefix: com.impulsegatekeeper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: tr
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ImpulseGatekeeper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "Bekle"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        LSApplicationQueriesSchemes:
          - instagram-stories
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: ImpulseGatekeeper.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.impulsegatekeeper.app
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.impulsegatekeeper.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impulsegatekeeper.app
        PRODUCT_NAME: "Bekle"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: GatekeeperExtension
        embed: true
      # GatekeeperWidgetExtension temporarily not embedded: a sideloaded install crashed with a
      # CODESIGNING/"Invalid Page" kernel-level signature rejection specifically in this
      # extension's process, which likely also blocked the main app from launching at all (iOS
      # validates every embedded binary's signature before the host app runs). Re-enable once the
      # signing/provisioning issue for this target is sorted out — see README "Bilinen sorunlar".

  GatekeeperExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GatekeeperExtension/SafariWebExtensionHandler.swift
      - path: Sources/Models
      - path: Sources/Services/SharedModelContainer.swift
      - path: Sources/Services/WageCalculator.swift
      - path: Sources/Services/CurrencyFormatter.swift
    resources:
      - path: GatekeeperExtension/Resources
    info:
      path: Generated/GatekeeperExtension-Info.plist
      properties:
        CFBundleDisplayName: "Bekle"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: GatekeeperExtension/GatekeeperExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.impulsegatekeeper.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impulsegatekeeper.app.extension
        TARGETED_DEVICE_FAMILY: "1"

  GatekeeperWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GatekeeperWidget
      - path: Sources/Models
      - path: Sources/Services/SharedModelContainer.swift
      - path: Sources/Services/WageCalculator.swift
      - path: Sources/Services/CurrencyFormatter.swift
    info:
      path: Generated/GatekeeperWidgetExtension-Info.plist
      properties:
        CFBundleDisplayName: "Bekle Widget"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GatekeeperWidget/GatekeeperWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.impulsegatekeeper.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impulsegatekeeper.app.widget
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  ImpulseGatekeeper:
    build:
      targets:
        ImpulseGatekeeper: all
        GatekeeperExtension: all
        GatekeeperWidgetExtension: all
    run:
      config: Debug
      storeKitConfiguration: Resources/Configuration.storekit
    test:
      config: Debug
    archive:
      config: Release
