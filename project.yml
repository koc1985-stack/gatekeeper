name: ImpulseGatekeeper
options:
  bundleIdPrefix: com.impulsegatekeeper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: tr
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "R6W7XU4TM7"
    CODE_SIGN_STYLE: Automatic
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0
targets:
  ImpulseGatekeeper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "DurBi"
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        LSApplicationQueriesSchemes:
          - instagram-stories
        ITSAppUsesNonExemptEncryption: false
        # Google Sign-In: OAuth client ID from Google Cloud Console for this bundle ID
        # (com.impulsegatekeeper.app) — until a real one is set, GoogleSignInSupport.isConfigured
        # keeps the Google sign-in button hidden instead of failing when tapped.
        GIDClientID: "REPLACE_WITH_YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "com.googleusercontent.apps.REPLACE_WITH_YOUR_GOOGLE_CLIENT_ID"
        # AdMob: Google's public TEST App ID — swap for DurBi's real App ID once it's
        # registered at admob.google.com (must match AdsSupport.bannerAdUnitID's account).
        GADApplicationIdentifier: "ca-app-pub-3940256099942544~1458002511"
        NSUserTrackingUsageDescription: "Sana daha uygun reklamlar gösterebilmemiz için bu izne ihtiyacımız var. İzin vermesen de uygulamayı sorunsuz kullanmaya devam edebilirsin."
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: "cstr6suwn9.skadnetwork"
    entitlements:
      path: ImpulseGatekeeper.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.impulsegatekeeper.app
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: production
        com.apple.security.application-groups:
          - group.com.impulsegatekeeper.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impulsegatekeeper.app
        PRODUCT_NAME: "DurBi"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: GatekeeperExtension
        embed: true
      - target: GatekeeperWidgetExtension
        embed: true
      - target: GatekeeperShareExtension
        embed: true
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleMobileAds
        product: GoogleMobileAds

  GatekeeperExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GatekeeperExtension/SafariWebExtensionHandler.swift
      - path: Sources/Models
      - path: Sources/Services/SharedModelContainer.swift
      - path: Sources/Services/WageCalculator.swift
      - path: Sources/Services/CurrencyFormatter.swift
    postCompileScripts:
      - name: Copy Safari Extension Resources
        script: |
          set -e
          DEST="${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}"
          mkdir -p "$DEST"
          cp "${SRCROOT}/GatekeeperExtension/Resources/manifest.json" "$DEST/"
          cp "${SRCROOT}/GatekeeperExtension/Resources/background.js" "$DEST/"
          cp "${SRCROOT}/GatekeeperExtension/Resources/content.js" "$DEST/"
          cp "${SRCROOT}/GatekeeperExtension/Resources/overlay-styles.js" "$DEST/"
          cp "${SRCROOT}/GatekeeperExtension/Resources/site-selectors.js" "$DEST/"
          cp "${SRCROOT}/GatekeeperExtension/Resources/icon-48.png" "$DEST/"
          cp "${SRCROOT}/GatekeeperExtension/Resources/icon-96.png" "$DEST/"
          cp "${SRCROOT}/GatekeeperExtension/Resources/icon-128.png" "$DEST/"
    info:
      path: Generated/GatekeeperExtension-Info.plist
      properties:
        CFBundleDisplayName: "DurBi"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: GatekeeperExtension/GatekeeperExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.impulsegatekeeper.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impulsegatekeeper.app.extension
        TARGETED_DEVICE_FAMILY: "1"

  GatekeeperWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GatekeeperWidget
      - path: Sources/Models
      - path: Sources/Services/SharedModelContainer.swift
      - path: Sources/Services/WageCalculator.swift
      - path: Sources/Services/CurrencyFormatter.swift
    info:
      path: Generated/GatekeeperWidgetExtension-Info.plist
      properties:
        CFBundleDisplayName: "DurBi Widget"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GatekeeperWidget/GatekeeperWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.impulsegatekeeper.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impulsegatekeeper.app.widget
        TARGETED_DEVICE_FAMILY: "1"

  GatekeeperShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GatekeeperShareExtension
      - path: Sources/Models
      - path: Sources/Services/SharedModelContainer.swift
      - path: Sources/Services/WageCalculator.swift
      - path: Sources/Services/CurrencyFormatter.swift
      - path: Sources/Services/ProductLinkFetcher.swift
      - path: Sources/Features/Shared/MoodPicker.swift
      - path: Sources/Features/Shared/ReflectionSection.swift
    info:
      path: Generated/GatekeeperShareExtension-Info.plist
      properties:
        CFBundleDisplayName: "DurBi'ye Ekle"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: GatekeeperShareExtension/GatekeeperShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.impulsegatekeeper.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impulsegatekeeper.app.share
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  ImpulseGatekeeper:
    build:
      targets:
        ImpulseGatekeeper: all
        GatekeeperExtension: all
        GatekeeperWidgetExtension: all
        GatekeeperShareExtension: all
    run:
      config: Debug
      storeKitConfiguration: Resources/Configuration.storekit
    test:
      config: Debug
    archive:
      config: Release
